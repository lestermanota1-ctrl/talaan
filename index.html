/* PIN lock */
var LK={on:false,mode:'lock',view:'pad',buf:'',busy:false,msg:'',err:false,cover:false,hiddenAt:0};
function pinCfg(){try{return JSON.parse(ls.get('talaan-pin')||'null')}catch(e){return null}}
function hasPin(){var c=pinCfg();return !!(c&&c.h)}
async function pinHash(pin,salt){
  try{
    if(window.crypto&&crypto.subtle){
      var enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},key,256);
      return 'p'+Array.from(new Uint8Array(bits)).map(function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
    }
  }catch(e){}
  var h=5381,s=salt+':'+pin;
  for(var r=0;r<2000;r++){for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0}
  return 'f'+(h>>>0).toString(16);
}
async function verifyPin(pin){var c=pinCfg();if(!c)return false;return (await pinHash(String(pin),c.s))===c.h}
function lockoutInfo(){try{var o=JSON.parse(ls.get('talaan-pinfail')||'{}')||{};return {fails:o.f||0,until:o.u||0}}catch(e){return {fails:0,until:0}}}
function setLockout(f,u){ls.set('talaan-pinfail',JSON.stringify({f:f,u:u}))}
function lockHTML(view){
  var logo=MARK.replace('width="30" height="30"','width="84" height="84"');
  if(view==='cover')return '<div class="lock-in">'+logo+'<h1 class="login-t">TALAAN</h1></div>';
  if(view==='forgot')return '<div class="lock-in"><h2 class="h2">Forgot your PIN?</h2><p class="muted">A PIN cannot be recovered. The only way back in is to delete all data on this phone and start again. Your Google Sheet and any backup file you saved are not touched.</p><div class="acts" style="justify-content:center"><button class="btn bad" data-act="pinreset">Delete data and reset</button><button class="btn" data-act="pinback">Back</button></div></div>';
  var c=pinCfg(),n=c?c.n:4,dots='',keys='',i;
  for(i=0;i<n;i++)dots+='<i'+(i<LK.buf.length?' class="on"':'')+'></i>';
  for(i=1;i<=9;i++)keys+='<button class="pk" type="button" data-act="pk" data-k="'+i+'">'+i+'</button>';
  keys+='<span></span><button class="pk" type="button" data-act="pk" data-k="0">0</button><button class="pk x" type="button" data-act="pk" data-k="del" aria-label="Delete">&#9003;</button>';
  return '<div class="lock-in">'+logo+'<h1 class="login-t" style="font-size:24px">TALAAN</h1><p class="'+(LK.err?'err':'muted')+'">'+esc(LK.msg)+'</p><div class="dots" aria-label="PIN entry">'+dots+'</div><div class="pad">'+keys+'</div>'+(LK.mode==='kiosk'?'<button class="link" data-act="lockback">Back to scanning</button>':'')+'<button class="link" data-act="pinforgot">Forgot PIN?</button></div>';
}
function paintLock(view){
  var el=document.getElementById('lock');if(!el)return;
  if(!view){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;el.innerHTML=lockHTML(view);
}
function lockNow(mode){
  if(!hasPin())return;
  mode=mode||'lock';
  LK.on=true;LK.mode=mode;LK.view='pad';LK.buf='';LK.busy=false;LK.err=false;LK.cover=false;
  LK.msg=mode==='kiosk'?'Enter your PIN to leave kiosk mode':'Enter your PIN';
  if(mode==='lock'){
    ssDel('talaan-unlk');
    if(CAM.on&&!CAM.kiosk)camStop();
    S.sheet=null;$('#sheet').innerHTML='';$('#app').innerHTML='';$('#print').innerHTML='';
  }
  paintLock('pad');
}
function lockOpen(){
  var m=LK.mode;LK.on=false;LK.buf='';paintLock(null);ssSet('talaan-unlk','1');ssDel('talaan-hidat');
  if(m==='kiosk'){kioskStop();return}
  render();renderSheet();
  if(kioskFlag())kioskStart();
}
async function lockKey(k){
  if(!LK.on||LK.view!=='pad'||LK.busy)return;
  var c=pinCfg();if(!c)return;
  var lo=lockoutInfo(),now=Date.now();
  if(lo.until>now){LK.err=true;LK.msg='Too many tries. Wait '+Math.ceil((lo.until-now)/1000)+' seconds.';paintLock('pad');return}
  if(k==='del')LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<c.n)LK.buf+=k;
  LK.err=false;
  if(LK.buf.length<c.n){paintLock('pad');return}
  LK.busy=true;paintLock('pad');
  var ok=await verifyPin(LK.buf);
  LK.busy=false;
  if(ok){setLockout(0,0);lockOpen();return}
  var f=lo.fails+1,until=0;
  if(f%5===0)until=Date.now()+Math.min(600000,30000*Math.pow(2,f/5-1));
  setLockout(f,until);LK.buf='';LK.err=true;
  LK.msg=until?'Too many tries. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.':'Wrong PIN. Try again.';
  paintLock('pad');
}
async function doPinForm(){
  var sh=S.sheet;if(!sh||sh.type!=='pin')return;
  var mode=sh.mode,p0=String(S.f['f-pin0']||''),p1=String(S.f['f-pin1']||''),p2=String(S.f['f-pin2']||'');
  S.err='';
  if(mode==='change'||mode==='off'){
    if(!(await verifyPin(p0))){S.err='The current PIN is wrong.';renderSheet();return}
  }
  if(mode==='off'){
    ls.set('talaan-pin','');ls.set('talaan-pinfail','');['f-pin0','f-pin1','f-pin2'].forEach(function(k){delete S.f[k]});
    S.sheet=null;renderSheet();render();toast('PIN lock is off.');return;
  }
  if(!/^\d{4,6}$/.test(p1)){S.err='The PIN must be 4 to 6 digits.';renderSheet();return}
  if(p1!==p2){S.err='The two PINs do not match.';renderSheet();return}
  var old=pinCfg(),sb=new Uint8Array(12),salt='';
  try{crypto.getRandomValues(sb)}catch(e){for(var q=0;q<12;q++)sb[q]=Math.floor(Math.random()*256)}
  for(var z=0;z<sb.length;z++)salt+=(sb[z]%36).toString(36);
  var h=await pinHash(p1,salt);
  ls.set('talaan-pin',JSON.stringify({s:salt,h:h,n:p1.length,after:old&&old.after!==undefined?old.after:0,v:2}));
  setLockout(0,0);ssSet('talaan-unlk','1');
  ['f-pin0','f-pin1','f-pin2'].forEach(function(k){delete S.f[k]});
  S.sheet=null;S.err='';renderSheet();render();
  if(mode==='kiosk')kioskAsk();else toast('PIN lock is on.');
}
function pinCard(){
  var c=pinCfg(),h='<section class="card"><div class="head-row"><h3 class="h3">App lock (PIN)</h3><span class="pill '+(c?'p-present':'p-absent')+'">'+(c?'On':'Off')+'</span></div>';
  if(!c)return h+'<p class="hint">Student names and ID numbers are on this phone. With a PIN, nobody can open TALAAN without it.</p><div class="acts"><button class="btn sm pri" data-act="pinset">Set PIN</button></div></section>';
  var o=[[0,'Right away'],[1,'After 1 minute'],[5,'After 5 minutes'],[15,'After 15 minutes'],[-1,'Only when the app is closed']],after=c.after===undefined?0:c.after;

}

/* ---------- QR code generator (byte mode, error correction M, versions 1 to 10) ---------- */
var QR_ECC=[0,10,16,26,18,24,16,18,22,22,26];

  data.forEach(function(b){var f=b^r.shift();r.push(0);div.forEach(function(c,i){r[i]^=qrMul(c,f)})});
  return r;
}
function qrInterleave(data,ver){

  for(i=0;i<nb;i++){

    var ecc=qrRem(dat,div);
    if(i<ns)dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  var out=[];
  for(i=0;i<blocks[0].length;i++){blocks.forEach(function(b,j){if(i!==sl-el||j>=ns)out.push(b[i])})}
  return out;
}
function qrMatrix(text){

  function bit(x,n){return ((x>>>n)&1)!==0}

        case 4:inv=(Math.floor(xx/3)+Math.floor(yy/2))%2===0;break;

    }
    for(b=0;b<size;b++){
      color=false;run=0;h=[0,0,0,0,0,0,0];
      for(a=0;a<size;a++){
        if(mod[a][b]===color){run++;if(run===5)r+=3;else if(run>5)r++}
        else{hist(run,h);if(!color)r+=countPat(h)*40;color=mod[a][b];run=1}
      }

    for(a=0;a<size-1;a++)for(b=0;b<size-1;b++){

function qrSVG(text){

}

  return '<div class="fields"><div><div class="eyebrow">QR ID cards</div><h2 class="h2">Print QR codes</h2></div>'
    +'<p class="hint">Each card has a QR code and the student\u2019s name. 12 cards fit on one page, with dashed lines to cut along. A student who has no QR yet gets one based on their name, so scanning works right away and their attendance stays under the same record.</p>'
    +'<div class="acts"><button class="btn pri" data-act="qrprint" data-w="new"'+(n?'':' disabled')+'>Only those with no QR ('+n+')</button><button class="btn" data-act="qrprint" data-w="all"'+(all?'':' disabled')+'>Everyone ('+all+')</button></div>'
    +'<p class="hint">The QR holds the name or ID number, so give each card only to its student.</p>'
    +'<button class="btn" data-act="closesheet">Close</button></div>';
}

/* ---------- absent list ---------- */
function absentText(ses){
  if(ses.nc)return summaryText(ses);
  var c=classify(ses),over=isOver(ses),lab=over?'Absent':'Not yet in';
  var L=[lab+(S.section?' - '+S.section:''),ses.subject+' | '+fmtDate(ses.date),''];
  if(!c.a.length)L.push('No one is absent.');
  else{L.push(lab+' ('+c.a.length+' of '+S.students.length+'):');c.a.forEach(function(x,i){L.push((i+1)+'. '+x.st.n)})}
  if(c.e.length){L.push('','Excused ('+c.e.length+'):');c.e.forEach(function(x){L.push('- '+x.st.n+(x.rec.x?' ('+x.rec.x+')':''))})}
  return L.join('\n');
}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyText(t);
}

/* ---------- appearance ---------- */
function themePref(){var t=ls.get('talaan-theme');return t==='dark'||t==='light'?t:'auto'}
function applyTheme(t){
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
function themeCard(){
  var t=themePref();
  return '<div class="seg">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(function(x){return '<button class="btn'+(t===x[0]?' on':'')+'" type="button" data-act="theme" data-t="'+x[0]+'" aria-pressed="'+(t===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><p class="hint">Auto follows your phone\u2019s setting.</p>';
}

/* ---------- calendar ---------- */
function classFirst(x){
  var f='';
  Object.keys(S.sessions).forEach(function(k){var s=S.sessions[k];if(s.sch===x.id||norm(s.subject)===norm(x.subject)){if(!f||s.date<f)f=s.date}});
  return f;
}
function calPending(ds,by){
  var wd=parseDate(ds).getDay(),t0=todayStr(),out=[];
  S.schedules.forEach(function(x){
    if(!slotOf(x,wd))return;
    var has=(by[ds]||[]).some(function(s){return s.sch===x.id||norm(s.subject)===norm(x.subject)});
    if(has)return;
    if(ds<t0){var f=classFirst(x);if(!f||ds<f)return}
    out.push(x);
  });
  return out;
}
function calCard(){
  var m=S.calM||todayStr().slice(0,7),p=m.split('-'),y=+p[0],mo=+p[1],t0=todayStr();
  var span=monthSpan(m,1),by={};
  Object.keys(S.sessions).forEach(function(k){var s=S.sessions[k];if(s.date>=span[0]&&s.date<=span[1])(by[s.date]=by[s.date]||[]).push(s)});
  var first=new Date(y,mo-1,1).getDay(),nd=new Date(y,mo,0).getDate(),cells='',i,d;
  ['S','M','T','W','T','F','S'].forEach(function(w){cells+='<span class="wh">'+w+'</span>'});
  for(i=0;i<first;i++)cells+='<span class="cd e"></span>';
  for(d=1;d<=nd;d++){
    var ds=m+'-'+pad(d),ss=by[ds]||[],held=ss.filter(function(s){return !s.nc}).length,nc=ss.length-held,pend=calPending(ds,by).length;
    var dots=(held?'<i class="dk h"></i>':'')+(nc?'<i class="dk n"></i>':'')+(pend?'<i class="dk '+(ds<t0?'m':'s')+'"></i>':'');
    cells+='<button class="cd'+(ds===t0?' today':'')+'" type="button" data-act="calday" data-d="'+ds+'" aria-label="'+esc(wkDate(ds))+'"><b>'+d+'</b><span class="dots">'+dots+'</span></button>';
  }
  return '<section class="card"><div class="head-row"><button class="btn sm" type="button" data-act="calnav" data-n="-1" aria-label="Previous month">&#8249;</button><h3 class="h3">'+esc(monthName(m))+'</h3><button class="btn sm" type="button" data-act="calnav" data-n="1" aria-label="Next month">&#8250;</button></div>'
    +'<div class="cal">'+cells+'</div>'
    +'<div class="cleg"><span><i class="dk h"></i>Held</span><span><i class="dk n"></i>No class</span><span><i class="dk m"></i>Not recorded</span><span><i class="dk s"></i>Scheduled</span></div></section>';
}
function dayBody(sh){
  var ds=sh.d,by={},ad=true;
  by[ds]=Object.keys(S.sessions).map(function(k){return S.sessions[k]}).filter(function(s){return s.date===ds}).sort(function(a,b){return String(a.start).localeCompare(String(b.start))});
  var pend=calPending(ds,by),t0=todayStr();
  var h='<div class="fields"><div><div class="eyebrow">'+(ds===t0?'Today':ds<t0?'Past':'Coming up')+'</div><h2 class="h2">'+esc(wkDate(ds))+'</h2></div>';
  if(!by[ds].length&&!pend.length)h+='<p class="hint">No class on this day.</p>';
  if(by[ds].length)h+='<ul class="rows">'+by[ds].map(function(s){
    var st=statsOf(s);
    var sub=esc(fmt12(s.start))+(s.end?' to '+esc(fmt12(s.end)):'')+(s.nc?' &middot; No class'+(s.ncr?': '+esc(s.ncr):''):' &middot; Present '+st.p+' &middot; Late '+st.l+' &middot; Excused '+st.e+(isOver(s)?' &middot; Absent '+st.a:''));
    return '<li class="mrow"><div style="min-width:0"><span class="nm">'+esc(s.subject)+(s.nc?' <span class="pill p-excused">No class</span>':'')+'</span><span class="sub hint">'+sub+'</span></div><div class="acts"><button class="btn sm pri" data-act="dayopen" data-id="'+s.id+'">Open</button>'+(ad?(s.nc?'<button class="btn sm" data-act="dayncoff" data-id="'+s.id+'">Undo No class</button>':'<button class="btn sm" data-act="ncopen" data-id="'+s.id+'">No class</button>'):'')+'</div></li>';
  }).join('')+'</ul>';
  if(pend.length)h+='<ul class="rows">'+pend.map(function(x){
    return '<li class="mrow"><div style="min-width:0"><span class="nm">'+esc(x.subject)+'</span><span class="sub hint">'+(ds<t0?'No meeting recorded':ds===t0?'Scheduled for today':'Scheduled')+'</span></div>'+(ad?'<div class="acts"><button class="btn sm" data-act="ncnew" data-id="'+x.id+'" data-d="'+ds+'">No class</button></div>':'')+'</li>';
  }).join('')+'</ul>';
  return h+'<button class="btn" data-act="closesheet">Close</button></div>';
}
function act3(a,d){
  switch(a){
    case 'calnav':{var m=S.calM||todayStr().slice(0,7),p=m.split('-'),dt=new Date(+p[0],+p[1]-1+parseInt(d.n,10),1);S.calM=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render();return true}
    case 'calday':S.sheet={type:'day',d:d.d};renderSheet();return true;
    case 'dayopen':S.sheet=null;renderSheet();act('opensession',{id:d.id});return true;
    case 'dayncoff':{var o=S.sessions[d.id];if(o)withUndo('No class removed.',function(){delete o.nc;delete o.ncr;persistSession(o.id)});S.sheet={type:'day',d:o?o.date:todayStr()};renderSheet();render();return true}
    case 'qrsheet':S.sheet={type:'qrsheet'};renderSheet();return true;
    case 'qrprint':{
      var list=d.w==='new'?S.students.filter(function(s){return !s.c}):S.students.slice();
      if(!list.length){toast('Nobody to print.');return true}
      qrAssign();S.sheet=null;renderSheet();render();
      printQR(list.map(function(s){return stuBy(s.i)||s}));
      return true;
    }
    case 'qrone':{var st=stuBy(d.i);if(!st)return true;qrAssign();render();printQR([st]);return true}
    case 'absentshare':{var s=S.sessions[d.id];if(s)shareText(absentText(s));return true}
    case 'theme':ls.set('talaan-theme',d.t==='auto'?'':d.t);applyTheme(d.t);render();return true;
  }
  return false;
}

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  autoBak();
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.id||!t.matches('input,textarea,select'))return;
  S.f[t.id]=t.type==='checkbox'?t.checked:t.value;
  if(t.id==='f-q')partial('manual-results',manualResults);
  else if(t.id==='f-newname')partial('link-results',linkResults);
  else if(t.id==='cam-name')camSug();
  else if(t.id==='f-sq')partial('roster-results',rosterResults);
  else if(t.id==='f-rmonth'||t.id==='f-rqstart'){if(t.value){setRange(S.range.mode,t.value);render()}}
  else if(t.id==='f-rfrom'||t.id==='f-rto'){if(t.id==='f-rfrom')S.range.from=t.value;else S.range.to=t.value;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&(e.target.id==='cam-name'||e.target.id==='cam-email')){e.preventDefault();camSave(($('#cam-name')||{}).value)}});
document.addEventListener('submit',function(e){e.preventDefault();var n=e.target.dataset&&e.target.dataset.form;if(n)submitForm(n)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
function bindFile(id,mode){
  var el=document.getElementById(id);
  el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';scanFile(f,mode)});
}
bindFile('f-cam','scan');bindFile('f-gal','scan');bindFile('f-reg','reg');
(function(){var el=document.getElementById('f-bak');el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';readBackup(f)})})();

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEvt=e;if(S.tab==='scan')render()});
window.addEventListener('appinstalled',function(){S.installEvt=null;render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

init();
})();
</script>
