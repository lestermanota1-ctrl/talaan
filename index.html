<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALAAN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A1A5C">
<script>try{var tt=localStorage.getItem("talaan-theme");if(tt==="dark"||tt==="light")document.documentElement.setAttribute("data-theme",tt)}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talaan">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Design: soft light surfaces, one indigo accent, Manrope type, a floating tab bar with a raised center Scan button, and a big round Scan button in the middle of the home screen. */
:root{
  color-scheme:light;
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#EDF0F7; --fg:#0F1729; --muted:#667089; --line:#E3E7F0;
  --accent:#3355FF; --accent-fg:#FFFFFF; --accent-soft:#E6EBFF;
  --ok:#0B7F51; --ok-bg:#DDF5EA; --late:#9A5700; --late-bg:#FFEFCF; --exc:#3A57A5; --exc-bg:#E3EAFB; --bad:#C02B2B; --bad-bg:#FDE4E4;
  --shade:rgba(10,16,34,.45);
  --sh1:0 1px 2px rgba(16,24,48,.05),0 6px 18px rgba(16,24,48,.05);
  --sh-nav:0 12px 32px rgba(16,24,48,.16),0 2px 6px rgba(16,24,48,.06);
  --sh-fab:0 10px 24px rgba(51,85,255,.40);
  --sh-btn:0 18px 40px rgba(51,85,255,.30);
  --av-bg-s:80%; --av-bg-l:91%; --av-fg-s:55%; --av-fg-l:34%;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1E; --surface:#131A2E; --surface-2:#1B2440; --fg:#EAEFFC; --muted:#8F9BBB; --line:#222C48;
    --accent:#8AA0FF; --accent-fg:#0A0F1E; --accent-soft:#1E2850;
    --ok:#4FD69C; --ok-bg:#0F3123; --late:#F5B85C; --late-bg:#3A2A10; --exc:#9DB6F2; --exc-bg:#1A2848; --bad:#FF8C8C; --bad-bg:#3C1B1F;
    --shade:rgba(0,0,0,.6);
    --sh1:0 1px 0 rgba(255,255,255,.03) inset;
    --sh-nav:0 12px 32px rgba(0,0,0,.45);
    --sh-fab:0 10px 24px rgba(138,160,255,.28);
    --sh-btn:0 18px 40px rgba(138,160,255,.20);
    --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0A0F1E; --surface:#131A2E; --surface-2:#1B2440; --fg:#EAEFFC; --muted:#8F9BBB; --line:#222C48;
    --accent:#8AA0FF; --accent-fg:#0A0F1E; --accent-soft:#1E2850;
    --ok:#4FD69C; --ok-bg:#0F3123; --late:#F5B85C; --late-bg:#3A2A10; --exc:#9DB6F2; --exc-bg:#1A2848; --bad:#FF8C8C; --bad-bg:#3C1B1F;
    --shade:rgba(0,0,0,.6);
    --sh1:0 1px 0 rgba(255,255,255,.03) inset;
    --sh-nav:0 12px 32px rgba(0,0,0,.45);
    --sh-fab:0 10px 24px rgba(138,160,255,.28);
    --sh-btn:0 18px 40px rgba(138,160,255,.20);
    --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
    color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:500;letter-spacing:-.005em;-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
.in{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;line-height:1.4}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;border-radius:11px}
.brand-t{min-width:0}
.brand-name{font-family:var(--body);font-weight:800;font-size:20px;letter-spacing:.09em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:54%;min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:13px;font-weight:700}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.banner{padding-bottom:10px}
.banner p{background:var(--late-bg);color:var(--late);font-size:13px;font-weight:600;padding:10px 14px;border-radius:14px}

/* shell */
main.in{padding-top:6px;padding-bottom:132px;display:flex;flex-direction:column;gap:16px}
.title{font-family:var(--body);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1.1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;width:100%;max-width:520px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;grid-template-rows:60px;align-items:stretch;height:66px;padding:0 6px 6px;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:var(--sh-nav)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:16px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:18px;height:3px;border-radius:3px;background:var(--accent)}
.tab-scan{overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;border:0;background:none;padding:0 0 3px;color:var(--accent);font-size:11px;font-weight:800}
.tab-scan>*{flex:none}
.fab{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:4px solid var(--bg);box-shadow:var(--sh-fab);transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.2}
.tab-scan:active .fab{transform:scale(.93)}
.tab-scan[aria-current="page"] .fab{box-shadow:0 0 0 5px var(--accent-soft),var(--sh-fab)}

/* cards and type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh1)}
.card-flat{padding-block:8px}
.h2{font-family:var(--body);font-weight:800;font-size:21px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.h3{font-family:var(--body);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:var(--surface-2);font-weight:700;font-size:14.5px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-present{background:var(--ok-bg);color:var(--ok)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-excused{background:var(--exc-bg);color:var(--exc)}
.p-absent{background:var(--surface-2);color:var(--muted)}
.p-noqr{background:var(--late-bg);color:var(--late)}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea{width:100%;min-height:48px;padding:11px 14px;font-size:16px;font-weight:600;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px}
input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500}
input:focus,textarea:focus{outline:0;border-color:var(--accent);background:var(--surface)}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:14px;font-weight:500}
.fields{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:13px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px;min-height:36px}
.field-ic{position:relative}
.field-ic>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.field-ic input{padding-left:44px}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:13.5px;font-weight:800;letter-spacing:.02em;background:hsl(var(--h) var(--av-bg-s) var(--av-bg-l));color:hsl(var(--h) var(--av-fg-s) var(--av-fg-l))}

/* home: class summary */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-top>div:first-child{min-width:0}
.ring{flex:none}
.ring-t{font-family:var(--body);font-weight:800;font-size:14px;fill:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-stat{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:700}
.chip-stat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip-stat.s-p::before{background:var(--ok)}
.chip-stat.s-l::before{background:var(--late)}
.chip-stat.s-e::before{background:var(--exc)}
.chip-stat b{font-variant-numeric:tabular-nums}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.meta{font-size:13px;color:var(--muted);font-weight:600}

/* home: scan button */
.scan-zone{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 8px;text-align:center}
.scan-btn{position:relative;display:grid;place-items:center;width:168px;height:168px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:var(--sh-btn),inset 0 2px 0 rgba(255,255,255,.28);transition:transform .15s}
.scan-btn:active{transform:scale(.97)}
.scan-btn svg{width:64px;height:64px}
.scan-btn::before,.scan-btn::after{content:"";position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none}
.scan-btn::before{inset:-14px;opacity:.3}
.scan-btn::after{inset:-30px;opacity:.14}
.scan-btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.scan-btn:disabled::before,.scan-btn:disabled::after{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .scan-btn.busy::before{animation:pulse 1.2s ease-out infinite}
  .scan-btn.busy::after{animation:pulse 1.2s .3s ease-out infinite}
}
@keyframes pulse{from{transform:scale(.94);opacity:.5}to{transform:scale(1.08);opacity:0}}
.scan-cap{display:flex;flex-direction:column;gap:2px;max-width:300px}
.scan-cap strong{font-family:var(--body);font-weight:800;font-size:20px;letter-spacing:-.025em}
.pair .btn,main>.acts .btn{background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}

/* results and manual entry */
.res{border-width:1.5px}
.res-ok{border-color:var(--ok);background:var(--ok-bg)}
.res-late{border-color:var(--late);background:var(--late-bg)}
.res-dup{border-color:var(--exc);background:var(--exc-bg)}
.res-fail{border-color:var(--bad);background:var(--bad-bg)}
.res .name{font-family:var(--body);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.res-main{display:flex;align-items:center;gap:12px}
.res-main .av{width:48px;height:48px;font-size:16px}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.raw{font-size:13px;word-break:break-all;background:var(--surface);border-radius:12px;padding:10px 12px}
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

/* setup steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step p{font-size:13.5px;color:var(--muted)}
.step strong{display:block;font-size:14.5px}

/* stats and lists */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface-2)}
.stat b{display:block;font-family:var(--body);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.stat.s-p{background:var(--ok-bg)}.stat.s-p b,.stat.s-p span{color:var(--ok)}
.stat.s-l{background:var(--late-bg)}.stat.s-l b,.stat.s-l span{color:var(--late)}
.stat.s-e{background:var(--exc-bg)}.stat.s-e b,.stat.s-e span{color:var(--exc)}
.stat.s-a b,.stat.s-a span{color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;min-height:38px}
.f[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.rows>li{border-bottom:1px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.row-btn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 0;text-align:left;min-height:60px}
.row-btn .nm,.row .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.tm{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:60px}
.row>div:not(.acts){flex:1;min-width:0}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;font-weight:500}
.sub{display:block;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px;font-weight:700}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{align-items:flex-start}
.mrow{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.gsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* schedule form */
.daybox{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:700;min-height:44px;padding:6px 14px;border-radius:999px;background:var(--surface-2);cursor:pointer}
.daybox input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.sdays{display:flex;flex-direction:column;gap:8px}
.sday{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sday .daybox{width:100%;padding-inline:12px}
.sday.hdr{padding-top:0}
.sday input[type=time]{padding:8px 6px;min-height:44px}
.sday:has(input[type=checkbox]:not(:checked)) input[type=time]{opacity:.45}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:84px;border:0;border-radius:18px;background:var(--surface-2)}
.fmt strong{font-family:var(--body);font-weight:800;font-size:18px;letter-spacing:-.02em}
@media (max-width:340px){.fmts{grid-template-columns:1fr}}

/* camera */
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:50%;top:36%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28px;box-shadow:0 0 0 100vmax rgba(5,10,25,.55)}
.cam-frame i{position:absolute;width:40px;height:40px;border:5px solid #fff}
.cam-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:28px}
.cam-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:28px}
.cam-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:28px}
.cam-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:28px}
.cam-frame::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:3px;border-radius:3px;background:#fff;opacity:.85;box-shadow:0 0 12px rgba(255,255,255,.7)}
@media (prefers-reduced-motion:no-preference){.cam-frame::after{animation:sweep2 1.6s ease-in-out infinite alternate}}
@keyframes sweep2{from{top:14px}to{top:calc(100% - 17px)}}
.cam-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cam-msg{border-radius:18px;padding:14px 16px;background:var(--surface-2);min-height:76px}
.cam-msg.ok{background:var(--ok-bg);color:var(--ok)}
.cam-msg.late{background:var(--late-bg);color:var(--late)}
.cam-msg.dup{background:var(--exc-bg);color:var(--exc)}
.cam-t{font-family:var(--body);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.cam-s{font-size:14px;margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
.cam-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cam-msg.new{background:var(--accent-soft);color:var(--accent)}
.cam-msg.fail{background:var(--bad-bg);color:var(--bad)}
.cam-reg{display:flex;flex-direction:column;gap:10px}
.cam-raw{margin:0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cam-sug{display:flex;gap:8px;flex-wrap:wrap}
.cam-sug .hint{width:100%;margin:0}
.cam-sug .btn{min-height:40px;padding:6px 14px}

/* sync indicator */
.sync{display:inline-flex;align-items:center;gap:6px;max-width:58vw;min-height:0;padding:3px 0 0;border:0;background:none;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sync i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.s-ok{color:var(--ok)}
.sync.s-wait,.sync.s-off{color:var(--late)}
.sync.s-err{color:var(--bad)}
.sync.s-busy{color:var(--accent)}
.sync.s-busy i{animation:pulse 1s ease-in-out infinite}

/* sheet and toast */
body.sec [data-act="secsheet"]{display:none!important}
#ld{position:fixed;left:0;right:0;top:0;z-index:90;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.ld-bar{display:block;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:ldmove 1.1s ease-in-out infinite}
.ld-chip{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--surface);color:var(--fg);box-shadow:0 6px 24px rgba(10,20,60,.22);font-size:14px;font-weight:700;white-space:nowrap}
#ld.quiet .ld-chip{display:none}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:ldspin .7s linear infinite;flex:none}
@keyframes ldmove{0%{background-position:-40% 0}100%{background-position:140% 0}}
@keyframes ldspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ld-bar,.spin{animation-duration:2.4s}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}.login-in{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}.login-t{margin:0;font-size:30px;letter-spacing:.14em;font-weight:800}.login .card{width:100%;text-align:left;margin-top:10px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--shade)}
.sheet-p{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding-top:26px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-p::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:4px;background:var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;box-shadow:var(--sh-nav)}
#toast.show{opacity:1}
body:has(#cam:not([hidden])) #toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}

/* undo toast */
#toast.act{pointer-events:auto}
#toast .undo{margin-left:14px;min-height:0;padding:5px 12px;border:0;border-radius:10px;background:rgba(127,127,127,.3);color:inherit;font-weight:800;font-size:14px}

/* v12 additions */
select{width:100%;min-height:48px;padding:11px 14px;font-size:16px;font-weight:600;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.secbtn{display:block;background:none;border:0;padding:0;text-align:left;font-family:inherit;cursor:pointer}
.secbtn::after{content:" \25BE"}
.banner p .link{padding:2px 6px;min-height:0;margin-left:6px;color:inherit;text-decoration:underline}
.ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:25;width:min(92vw,520px);box-shadow:var(--sh-nav)}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.lock-in{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.dots{display:flex;gap:14px;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.pk{min-height:64px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line);font-size:24px;font-weight:700}
.pk:active{background:var(--surface-2)}
.pk.x{background:none;box-shadow:none;font-size:18px;color:var(--muted)}
.kx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;min-height:40px;padding:8px 14px;border:0;border-radius:999px;background:rgba(255,255,255,.88);color:#0F1729;font-weight:800;font-size:13px}
.kx-info{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:14px;right:130px;z-index:5;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cam.kiosk .cam-t{font-size:30px}
.stu-head{display:flex;align-items:center;gap:14px}
.stu-head .av{width:56px;height:56px;font-size:18px}
.rate-big{font-family:var(--body);font-weight:800;font-size:40px;letter-spacing:-.04em;line-height:1}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow .d{flex:1;min-width:0}

/* v13 additions */
.signout{margin-top:26px;display:flex}
.signout .btn{width:100%}
.acc{padding:0;gap:0;border-radius:18px}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 16px;min-height:62px;text-align:left}
.acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-t b{font-weight:700;font-size:15.5px}
.chev{font-size:22px;color:var(--muted);line-height:1}
.acc-body{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding:14px 16px 18px}
.acc-body .card{padding:0;background:none;border:0;box-shadow:none;border-radius:0}
.acc-body .h3{display:none}
.acc-g{margin:20px 4px 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .btn{padding:10px 6px}
.seg .btn.on{background:var(--accent-soft);color:var(--accent)}
.sigslot{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px}
.sigbox{min-height:64px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;border:1px dashed var(--line)}
.sigbox img{max-height:60px;max-width:100%}
#sig-pad{width:100%;height:auto;background:#fff;border-radius:14px;border:1px solid var(--line);touch-action:none;display:block}

/* v14 additions */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cd{aspect-ratio:1/1.05;border:0;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px}
.cd.e{background:none;pointer-events:none}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dots{display:flex;gap:3px;min-height:7px}
.dk{width:7px;height:7px;border-radius:50%;display:inline-block;box-sizing:border-box}
.dk.h{background:var(--ok)}
.dk.n{background:var(--late)}
.dk.m{background:var(--bad)}
.dk.s{border:1.5px solid var(--muted)}
.cleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.cleg span{display:inline-flex;align-items:center;gap:5px}

/* printable reports */
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body::before{display:none!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font:11px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print h1{font-size:18px;margin:0 0 4px;font-weight:800}
  #print p{margin:0 0 3px;font-size:11px}
  #print .foot{margin-top:10px;color:#555;font-size:9px}
  #print table.pt{width:100%;border-collapse:collapse;margin-top:8px}
  #print thead{display:table-header-group}
  #print tr{break-inside:avoid}
  #print th,#print td{padding:3px 5px;border:1px solid #999;text-align:left;white-space:normal;font-weight:400;min-width:0;font-size:10.5px}
  #print th{background:#e4e8f5;font-weight:700;text-transform:none;letter-spacing:0;color:#000}
  #print td:first-child{font-weight:600;min-width:0}
  #print th.rot{height:125px;vertical-align:bottom;padding:3px 0;text-align:center;width:17px}
  #print th.rot span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:8.5px;font-weight:600}
  #print td.cP,#print td.cL,#print td.cE,#print td.cA{text-align:center;padding:3px 0;font-size:9.5px}
  #print th.n,#print td.n{width:1%;white-space:nowrap;text-align:center;padding:3px 7px}
  #print td.cA{background:#f6d5d5}
  #print td.cL{background:#fbe6b8}
  #print td.cE{background:#d9e3fa}
  #print .qpage{display:grid;grid-template-columns:repeat(3,1fr);break-after:page}
  #print .qpage:last-child{break-after:auto}
  #print .qc{border:1px dashed #888;height:68mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;overflow:hidden}
  #print .qc svg{width:38mm;height:38mm}
  #print .qc .qn{font-weight:800;font-size:13px;line-height:1.2}
  #print .qc .qs{font-size:9px;color:#444}
  #print .sigs{display:flex;flex-wrap:wrap;gap:22px 28px;margin-top:28px;break-inside:avoid}
  #print .sig{flex:1 1 28%;text-align:center;min-width:0}
  #print .sig .sl{text-align:left;font-size:10px;color:#444}
  #print .sig .si{height:58px;display:flex;align-items:flex-end;justify-content:center}
  #print .sig img{max-height:56px;max-width:100%}
  #print .sig .sn{border-top:1px solid #000;padding-top:3px;font-weight:700;font-size:11px}
  #print .sig .st{font-size:10px;color:#333}
}

/* ---------- storage ---------- */
function sortStudents(){S.students.sort(function(a,b){return a.n.localeCompare(b.n,'en',{sensitivity:'base'})})}
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)}
function sortedSessions(dir){var a=Object.keys(S.sessions).map(function(k){return S.sessions[k]}).sort(cmpSess);return dir==='asc'?a:a.reverse()}
function pickActive(){
  if(S.activeId&&S.sessions[S.activeId])return;
  var a=sortedSessions('desc'),t0=todayStr(),b=a.filter(function(x){return x.date<=t0});if(b.length)a=b;S.activeId=a.length?a[0].id:null;
}
function setActive(id){S.activeId=id;ls.set(actKey(),id||'')}
function saveLocal(){
  ls.set(secKey(S.curSec),JSON.stringify({students:S.students,section:S.section,schedules:S.schedules,sessions:S.sessions,gone:S.gone}));
  var sl=secList(),sc=sl.find(function(x){return x.id===S.curSec});if(sc&&sc.name!==S.section){sc.name=S.section;saveSecs(sl)}
}
function loadLocal(){
  try{
    var d=JSON.parse(ls.get(secKey(S.curSec))||'null');
    if(d){S.students=d.students||[];S.section=d.section||'';S.sessions=d.sessions||{};S.schedules=normSched(d.schedules||[]);S.gone=Array.isArray(d.gone)?d.gone:[];}
  }catch(e){}
  sortStudents();
}
function persistRoster(){saveLocal();cfgPushSoon()}
function persistSession(id){saveLocal();var s=S.sessions[id];if(s&&S.gs&&S.gs.url&&S.gs.auto)gsSync(s,false,false)}
function init(){
  S.gs=loadGs();
  var cs=ls.get('talaan-cursec')||'main';
  if(!secList().some(function(x){return x.id===cs}))cs=secList()[0].id;
  S.curSec=cs;S.activeId=ls.get(actKey());

  try{initLock()}catch(e){console.warn(e)}

  gsFlush().then(function(){cfgPush(false);gsPull(true)});
}

/* ---------- domain ---------- */
function active(){return S.activeId?S.sessions[S.activeId]:null}
function stuBy(i){return S.students.find(function(s){return s.i===i})}
function recOf(ses,i){return ses.records.find(function(r){return r.i===i})}
function lateAt(ses){var d=parseDate(ses.date),t=String(ses.start||'00:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t[0]||0,(t[1]||0)+Number(ses.grace||0))}
function endAt(ses){if(!ses.end)return null;var d=parseDate(ses.date),t=String(ses.end).split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t[0]||0,t[1]||0)}
function statusFor(ses,d){return d>lateAt(ses)?'late':'present'}
function statusNow(ses){return statusFor(ses,new Date())}
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function timeOn(ses,v){var m=/^(\d{1,2}):(\d{2})/.exec(String(v||''));if(!m)return null;var p=parseDate(ses.date);return new Date(p.getFullYear(),p.getMonth(),p.getDate(),+m[1],+m[2])}
function defaultTime(ses,rec){if(rec&&rec.t&&rec.s!=='excused')return hhmm(new Date(rec.t));return ses.date===todayStr()?hhmm(new Date()):(ses.start||'07:30')}
function fieldIso(){var ses=active(),el=$('#f-tm');if(!ses||!el)return null;var d=timeOn(ses,el.value);return d?d.toISOString():null}
function setTimeIn(i,v){
  var ses=active();if(!ses)return null;
  var d=timeOn(ses,v);if(!d)return null;
  var ex=recOf(ses,i),rec={i:i,t:d.toISOString(),m:ex?ex.m:'manual',s:statusFor(ses,d)};
  if(ex&&ex.s!=='excused'&&ex.t&&Math.floor(new Date(ex.t).getTime()/60000)!==Math.floor(d.getTime()/60000))rec.ed=1;
  else if(ex&&ex.ed)rec.ed=1;
  ses.records=ex?ses.records.map(function(r){return r.i===i?rec:r}):ses.records.concat([rec]);
  persistSession(ses.id);return rec;
}
function findStudent(raw){
  var n=norm(raw);if(!n)return null;
  var withCode=S.students.filter(function(s){return s.c});
  var hit=withCode.find(function(s){return norm(s.c)===n});
  if(hit)return hit;
  return withCode.find(function(s){var c=norm(s.c);return c.length>=4&&n.indexOf(c)!==-1})||null;
}
function markIn(i,method){
  var ses=active();
  if(!ses){toast('Add a class first.');return null}
  if(ses.nc){toast('This meeting is marked No class.');return null}
  if(ses.closed&&method==='qr'){toast('This class has ended, so scanning is off. Tap Reopen class to continue.');return null}
  var ex=recOf(ses,i);if(ex)return {dup:true,rec:ex};
  var en=endAt(ses);if(en&&new Date()>en)toast('Note: this class has already ended.');
  var rec={i:i,t:new Date().toISOString(),m:method,s:statusNow(ses)};
  ses.records=ses.records.concat([rec]);persistSession(ses.id);
  return {rec:rec};
}
function withX(o,s,x){x=String(x||'').trim().slice(0,80);if(s==='excused'&&x)o.x=x;return o}
function setStatus(i,s,x,iso){
  var ses=active();if(!ses)return;
  var ex=recOf(ses,i);
  if(ex){
    ses.records=ses.records.map(function(r){if(r.i!==i)return r;var t=r.t;if(!t&&s!=='excused')t=iso||new Date().toISOString();var o={i:r.i,t:t,m:r.m,s:s};if(r.ed)o.ed=1;return withX(o,s,x)});
  }else{
    ses.records=ses.records.concat([withX({i:i,t:s==='excused'?null:(iso||new Date().toISOString()),m:'manual',s:s},s,x)]);
  }
  persistSession(ses.id);
}
function removeRec(i){
  var ses=active();if(!ses)return;
  ses.records=ses.records.filter(function(r){return r.i!==i});persistSession(ses.id);
}
function classify(ses){
  var by=new Map(ses.records.map(function(r){return [r.i,r]}));
  var o={p:[],l:[],e:[],a:[]};
  S.students.forEach(function(st){
    var r=by.get(st.i),x={st:st,rec:r||null};
    if(!r)o.a.push(x);else if(r.s==='late')o.l.push(x);else if(r.s==='excused')o.e.push(x);else o.p.push(x);
  });
  return o;
}
function byTimeDesc(a,b){return String(b.rec.t||'').localeCompare(String(a.rec.t||''))}
function validEmail(e){return !e||/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(e)}
function addStudent(n,c,e){
  n=String(n).trim().replace(/\s+/g,' ');c=String(c).trim();e=String(e||'').trim();
  if(!n)return 'Enter the student name.';
  if(!validEmail(e))return 'That email does not look right.';
  if(c&&S.students.some(function(s){return norm(s.c)===norm(c)}))return 'A student with this QR code already exists.';
  var st={i:uid('u'),n:n,c:c,e:e};S.students.push(st);sortStudents();persistRoster();logAct('Student added',n);return st;
}
function doImport(text){
  var lines=String(text).split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var added=0,skipped=0;
  var codes=new Set(S.students.map(function(s){return norm(s.c)}).filter(Boolean));
  var names=new Set(S.students.map(function(s){return s.n.toLowerCase()}));
  lines.forEach(function(l){
    l=l.replace(/^\d{1,3}[.)]\s+/,'');
    var em='',mm=l.match(/[^\s,;|]+@[^\s,;|]+\.[^\s,;|]+/);
    if(mm){em=mm[0];l=l.replace(mm[0],' ').replace(/\s+/g,' ').replace(/[\s,;|]+$/,'').trim()}
    var c='',n=l,m=l.match(/^([^\s,;|\t]*\d[^\s,;|\t]*)\s*[,;|\t]?\s*(.*)$/);
    if(m&&m[1].length>=4){c=m[1];n=m[2]}
    n=n.replace(/\s+/g,' ').trim();
    if(!n||(c&&codes.has(norm(c)))||names.has(n.toLowerCase())){skipped++;return}
    S.students.push({i:uid('u'),n:n,c:c,e:em});names.add(n.toLowerCase());if(c)codes.add(norm(c));added++;
  });
  if(added){sortStudents();persistRoster();logAct('Students imported',added+' added')}
  return {added:added,skipped:skipped};
}

/* ---------- QR decoding ---------- */
async function loadBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  var url=URL.createObjectURL(file);
  var img=new Image();img.src=url;
  try{await img.decode()}finally{setTimeout(function(){URL.revokeObjectURL(url)},5000)}
  return img;
}
async function decodeQR(file){
  var src=await loadBitmap(file);
  var w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  if('BarcodeDetector' in window){
    try{var det=new window.BarcodeDetector({formats:['qr_code']});var r=await det.detect(src);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}
  }
  if(typeof window.jsQR!=='function')throw new Error('jsQR not loaded');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var seen={};
  var sizes=[1100,700,1600,450];
  for(var k=0;k<sizes.length;k++){
    var sc=Math.min(1,sizes[k]/Math.max(w0,h0));
    var w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    if(seen[w+'x'+h])continue;seen[w+'x'+h]=1;
    cv.width=w;cv.height=h;ctx.drawImage(src,0,0,w,h);
    var d=ctx.getImageData(0,0,w,h);
    var code=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});
    if(code&&code.data)return code.data;
    await new Promise(function(res){setTimeout(res,0)});
  }
  return null;
}
async function scanFile(file,mode){
  return ldWrap('Reading the QR...',function(){return scanFile_(file,mode)},false);
}
async function scanFile_(file,mode){
  if(!file)return;
  if(mode==='scan'&&!active()){toast('Add a class first.');return}
  if(mode==='scan'&&active().closed){toast('This class has ended, so scanning is off. Tap Reopen class to continue.');return}
  S.busy=true;S.last=null;render();
  var raw=null;
  try{raw=await decodeQR(file)}catch(e){console.warn(e)}
  S.busy=false;
  if(mode==='reg'){
    if(raw){S.f['f-code']=raw;toast('QR read.')}else toast('Could not read the QR. Try again.');
    render();return;
  }
  if(!raw){S.last={kind:'fail'};render();return}
  var st=findStudent(raw);
  if(!st){S.last={kind:'new',raw:raw};S.f['f-newname']='';render();return}
  var r=markIn(st.i,'qr');
  S.last=r&&r.dup?{kind:'dup',i:st.i}:{kind:'ok',i:st.i};
  render();
}

/* ---------- live camera scanner ---------- */
var CAM={on:false,stream:null,raf:0,last:0,busy:false,det:null,cv:null,ctx:null,lastRaw:'',lastAt:0,ac:null,mode:'scan',pending:'',added:0};
function beep(){
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)();if(CAM.ac.state==='suspended')CAM.ac.resume();var o=CAM.ac.createOscillator(),g=CAM.ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(CAM.ac.destination);o.start();o.stop(CAM.ac.currentTime+.12)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
}
function camSay(kind,title,sub){var m=$('#cam-msg');m.className='cam-msg '+kind;m.innerHTML='<div class="cam-t">'+esc(title)+'</div><div class="cam-s">'+esc(sub||'')+'</div>'}
function camCount(){
  if(CAM.kiosk)return '';
  if(CAM.mode==='reg')return S.students.length+' on your list'+(CAM.added?' \u00b7 '+CAM.added+' added now':'');
  var ses=active();if(!ses)return '';var st=statsOf(ses);return (st.p+st.l+st.e)+' of '+st.total+' checked in';
}
function camPanel(asking){var r=$('#cam-reg'),m=$('#cam-main');if(r)r.hidden=!asking;if(m)m.hidden=!!asking||!!CAM.kiosk}
function camSug(){
  var el=$('#cam-sug');if(!el)return;
  var q=String(($('#cam-name')||{}).value||'').trim().toLowerCase();
  var m=S.students.filter(function(x){return !x.c&&(!q||x.n.toLowerCase().indexOf(q)!==-1)}).slice(0,3);
  el.innerHTML=m.length?'<p class="hint">Already on your list? Tap to link this ID:</p>'+m.map(function(x){return '<button class="btn sm" type="button" data-act="camlink" data-i="'+esc(x.i)+'">'+esc(x.n)+'</button>'}).join(''):'';
}
function camUnknown(raw){
  CAM.pending=raw;beep();
  camSay('new','New ID, not on your list',CAM.mode==='scan'?'Type the name to add and time in.':'Type the name to add this student.');
  $('#cam-raw').textContent='ID: '+raw.slice(0,60);
  $('#cam-add').textContent=CAM.mode==='scan'?'Add & time in':'Add student';
  var nm=$('#cam-name');nm.value='';var cem=$('#cam-email');if(cem)cem.value='';camPanel(true);camSug();
  setTimeout(function(){try{nm.focus()}catch(e){}},60);
}
function camAfterAdd(st,linked){
  CAM.pending='';CAM.added++;CAM.lastRaw=st.c;CAM.lastAt=Date.now();camPanel(false);beep();
  if(CAM.mode==='scan'){
    var r=markIn(st.i,'qr');
    if(r&&r.rec){camSay(r.rec.s==='late'?'late':'ok',st.n,(linked?'Linked':'Added')+' \u00b7 '+(r.rec.s==='late'?'Late':'Timed in')+' \u00b7 '+fmtTime(r.rec.t)+' \u00b7 '+camCount());S.last={kind:'ok',i:st.i}}
    else camSay('ok',st.n,linked?'Linked':'Added');
  }else camSay('ok',st.n,(linked?'Linked to your list':'Added')+' \u00b7 '+camCount());
  render();
}
function camSave(nm){
  var raw=CAM.pending;if(!raw)return;
  nm=String(nm||'').replace(/\s+/g,' ').trim();
  if(!nm){toast('Type the name first.');return}
  var em=String((($('#cam-email')||{}).value)||'').trim();
  if(!validEmail(em)){toast('That email does not look right.');return}
  var ex=S.students.filter(function(x){return !x.c&&x.n.toLowerCase()===nm.toLowerCase()})[0];
  if(ex){ex.c=raw;if(em)ex.e=em;persistRoster();camAfterAdd(ex,true);return}
  var res=addStudent(nm,raw,em);
  if(typeof res==='string'){toast(res);return}
  camAfterAdd(res,false);
}
async function camStart(mode){
  return ldWrap('Opening camera...',function(){return camStart_(mode||'scan')},false);
}
async function camStart_(mode){
  if(CAM.on)return;
  if(mode==='reg'){}
  else{
  if(!active()){toast('Add a class first.');return}
  if(active().closed){toast('This class has ended, so scanning is off. Tap Reopen class to continue.');return}
  if(active().nc){toast('This meeting is marked No class.');return}
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){if(CAM.kiosk){kioskNoCam();return}toast('Live camera is not available here. Use photo scan instead.');return}
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){if(CAM.kiosk){kioskNoCam();return}toast(e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in your browser settings, then try again.':'Could not open the camera. Use photo scan instead.');return}
  CAM.stream=stream;
  var v=$('#cam-v');v.srcObject=stream;try{await v.play()}catch(e){}
  CAM.on=true;$('#cam').hidden=false;document.body.style.overflow='hidden';
  CAM.det=null;
  if('BarcodeDetector' in window){try{CAM.det=new window.BarcodeDetector({formats:['qr_code']})}catch(e){}}
  CAM.cv=CAM.cv||document.createElement('canvas');CAM.ctx=CAM.cv.getContext('2d',{willReadFrequently:true});
  CAM.lastRaw='';CAM.lastAt=0;CAM.busy=false;CAM.mode=mode;CAM.pending='';CAM.added=0;camPanel(false);
  if(CAM.kiosk)kioskIdle();else camSay('idle','Point the camera at the QR on the ID',camCount());
  camLoop();
}
function camStop(){
  CAM.on=false;CAM.pending='';camPanel(false);cancelAnimationFrame(CAM.raf);
  if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop()});CAM.stream=null}
  var v=$('#cam-v');if(v)v.srcObject=null;
  $('#cam').hidden=true;document.body.style.overflow='';
}
function camLoop(){
  if(!CAM.on)return;
  CAM.raf=requestAnimationFrame(camLoop);
  var now=performance.now(),v=$('#cam-v');
  if(CAM.busy||CAM.pending||now-CAM.last<140||v.readyState<2||!v.videoWidth)return;
  CAM.last=now;CAM.busy=true;
  camRead(v).then(function(raw){CAM.busy=false;if(raw&&CAM.on)camGot(raw)}).catch(function(){CAM.busy=false});
}
async function camRead(v){
  if(CAM.det){
    var threw=false;
    try{var r=await CAM.det.detect(v);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){threw=true}
    if(!threw)return null;
  }
  if(typeof window.jsQR!=='function')return null;
  var sc=Math.min(1,800/v.videoWidth),w=Math.max(1,Math.round(v.videoWidth*sc)),h=Math.max(1,Math.round(v.videoHeight*sc));
  CAM.cv.width=w;CAM.cv.height=h;CAM.ctx.drawImage(v,0,0,w,h);
  var d=CAM.ctx.getImageData(0,0,w,h),code=window.jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});
  return code&&code.data?code.data:null;
}
function camGot(raw){
  if(LK.on)return;
  var now=Date.now();
  if(raw===CAM.lastRaw&&now-CAM.lastAt<3500)return;
  CAM.lastRaw=raw;CAM.lastAt=now;
  if(CAM.kiosk){var ks=active();if(!ks||ks.closed||ks.nc){beep();camSay('fail',ks&&ks.nc?'No class today':'Scanning is closed',ks&&ks.nc?(ks.ncr||''):'This class has ended');kioskReset();return}}
  var st=findStudent(raw);
  if(CAM.mode==='reg'){
    if(st){beep();camSay('dup',st.n,'Already on your list');return}
    camUnknown(raw);return;
  }
  if(!st&&CAM.kiosk){beep();camSay('fail','ID not registered','Please see your teacher.');kioskReset();return}
  if(!st){
    camUnknown(raw);return;
  }
  var r=markIn(st.i,'qr');if(!r)return;
  beep();
  if(r.dup)camSay('dup',st.n,'Already timed in at '+fmtTime(r.rec.t));
  else camSay(r.rec.s==='late'?'late':'ok',st.n,(r.rec.s==='late'?'Late · ':'Timed in · ')+fmtTime(r.rec.t)+' · '+camCount());
  S.last={kind:r.dup?'dup':'ok',i:st.i};render();
  if(CAM.kiosk)kioskReset();
}
document.addEventListener('visibilitychange',function(){if(document.hidden&&CAM.on&&!CAM.kiosk)camStop();if(!document.hidden)checkEnd()});

var GS_SCRIPT="// Talaan v6: receives attendance from the Talaan app, keeps one tab per class, and signs people in.\n// Optional: add Script property EMAIL_CONFIRM = on to email students a confirmation when they are marked Present or Late.\n// Set two Script properties (Project Settings > Script properties): ADMIN_PASS and SECRETARY_PASS.\n// Whoever signs in with ADMIN_PASS is an admin. Whoever signs in with SECRETARY_PASS is a secretary. Any name works.\n// A secretary can add, edit and delete students and classes, mark No class, and make reports.\nvar SECRET = '__TOKEN__';\nvar TAB = 'Attendance';\nvar HEAD = ['Date', 'Subject', 'Section', 'Student', 'ID/QR', 'Status', 'Time in', 'Method', 'Start', 'End', 'Key'];\nvar REASON_COL = 12; // column L: excuse reason (column K is the hidden key)\nvar P = PropertiesService.getScriptProperties();\n\nfunction doGet() {\n  return json_({ ok: true, app: 'Talaan', v: 6 });\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var data = JSON.parse(e.postData.contents);\n    var role = roleOf_(data);\n    if (!role) return json_({ ok: false, error: 'auth' });\n    var admin = role === 'admin';\n    var user = admin ? null : { name: String(data.u || ''), classes: [] };\n    var act = data.action || 'ops';\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n\n    if (act === 'login') {\n      return json_({ ok: true, v: 6, role: role, name: String(data.u || '') || (admin ? 'Admin' : 'Secretary'), cfg: cfg_() });\n    }\n    if (act === 'pull') {\n      return json_({ ok: true, v: 6, rows: readRows_(ss, user), cfg: cfg_() });\n    }\n    if (act === 'ops') {\n      var sh = sheet_(ss);\n      var last = sh.getLastRow();\n      var keys = last > 1\n        ? sh.getRange(2, 11, last - 1, 1).getValues().map(function (r) { return String(r[0]); })\n        : [];\n      var ops = data.ops || [], n = 0, touched = {}, mails = [];\n      ops.forEach(function (op) {\n        if (!allowed_(user, op.row[1])) return;\n        var i = keys.indexOf(op.key), hasX = op.x !== undefined;\n        if (i > -1) {\n          sh.getRange(i + 2, 1, 1, HEAD.length).setValues([op.row.slice(0, HEAD.length)]);\n          if (hasX) sh.getRange(i + 2, REASON_COL).setValue(String(op.x || ''));\n        } else {\n          sh.appendRow(hasX ? op.row.slice(0, HEAD.length).concat([String(op.x || '')]) : op.row);\n          keys.push(op.key);\n          if (op.row[5] === 'Present' || op.row[5] === 'Late') mails.push(op.row);\n        }\n        touched[norm_(op.row[1])] = true;\n        n++;\n      });\n      rebuild_(ss, Object.keys(touched));\n      sendConfirms_(mails);\n      return json_({ ok: true, v: 6, n: n });\n    }\n\n    if (act === 'log') {\n      var lsh = logSheet_(ss), es = (data.entries || []).slice(0, 200), tz = Session.getScriptTimeZone();\n      var lrows = es.map(function (x) {\n        var tm = new Date(x.t);\n        return [isNaN(tm) ? String(x.t || '') : Utilities.formatDate(tm, tz, 'yyyy-MM-dd HH:mm:ss'),\n          String(x.u || data.u || (admin ? 'Admin' : 'Secretary')).slice(0, 80), role,\n          String(x.a || '').slice(0, 80), String(x.d || '').slice(0, 200)];\n      });\n      if (lrows.length) lsh.getRange(lsh.getLastRow() + 1, 1, lrows.length, 5).setValues(lrows);\n      return json_({ ok: true, v: 6, n: lrows.length });\n    }\n    if (act === 'getLog') {\n      var gsh = logSheet_(ss), glr = gsh.getLastRow(), gfrom = Math.max(2, glr - 99);\n      var gout = glr < 2 ? [] : gsh.getRange(gfrom, 1, glr - gfrom + 1, 5).getValues().map(function (r) { return r.map(cell_); }).reverse();\n      return json_({ ok: true, v: 6, rows: gout });\n    }\n    if (act === 'setConfig') {\n      var inc = data.cfg || {};\n      var out = inc;\n      setCfg_(JSON.stringify(out));\n      rebuild_(ss, null);\n      return json_({ ok: true, v: 6 });\n    }\n    if (act === 'rebuild') {\n      rebuild_(ss, null);\n      return json_({ ok: true, v: 6 });\n    }\n\n    if (!admin) return json_({ ok: false, error: 'forbidden' });\n\n    if (act === 'newYear') {\n      var lab = safeName_(String(data.label || '').trim() || Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd')).substr(0, 30);\n      ss.getSheets().forEach(function (sh) {\n        var nm = sh.getName();\n        if (nm === TAB || nm === 'Summary' || nm.indexOf('Class - ') === 0) {\n          var base = ('Archive ' + lab + ' - ' + nm).substr(0, 94), nn = base, k = 2;\n          while (ss.getSheetByName(nn)) nn = base + ' (' + (k++) + ')';\n          sh.setName(nn);\n        }\n      });\n      return json_({ ok: true, v: 6 });\n    }\n    if (act === 'test') {\n      var t = ss.getSheetByName('Test') || ss.insertSheet('Test');\n      t.appendRow([new Date(), 'Talaan connection OK']);\n      return json_({ ok: true, v: 6 });\n    }\n    return json_({ ok: false, error: 'unknown action' });\n  } catch (err) {\n    return json_({ ok: false, error: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n// Emails a confirmation to a student when a NEW Present/Late record is saved. Needs the student's email in the class list.\nfunction sendConfirms_(rows) {\n  try {\n    if (!rows.length || String(P.getProperty('EMAIL_CONFIRM') || '').trim().toLowerCase() !== 'on') return;\n    var stu = (cfg_() || {}).students || [], t0 = Date.now(), sent = {};\n    rows.forEach(function (r) {\n      if (Date.now() - t0 > 20000 || MailApp.getRemainingDailyQuota() < 1) return;\n      var c = norm_(r[4]), nm = norm_(r[3]), em = '';\n      stu.forEach(function (s) {\n        if (!em && s.e && ((c && norm_(s.c) === c) || norm_(s.n) === nm)) em = String(s.e).trim();\n      });\n      var k = em + '|' + r[0] + '|' + norm_(r[1]);\n      if (!em || sent[k]) return;\n      sent[k] = 1;\n      try {\n        MailApp.sendEmail({\n          to: em,\n          subject: 'Attendance recorded: ' + r[1] + ' (' + r[0] + ')',\n          body: 'Hi ' + r[3] + ',\\n\\nYour attendance was recorded.\\n\\nClass: ' + r[1] + '\\nDate: ' + r[0] + '\\nStatus: ' + r[5] + '\\nTime in: ' + r[6] + '\\n\\nThis is an automatic message from Talaan. If this is wrong, please tell your teacher or class secretary.',\n          name: 'Talaan Attendance'\n        });\n      } catch (e) {}\n    });\n  } catch (err) {}\n}\n\nfunction logSheet_(ss) {\n  var sh = ss.getSheetByName('Activity Log');\n  if (!sh) {\n    sh = ss.insertSheet('Activity Log');\n    sh.getRange(1, 1, 1, 5).setValues([['Time', 'User', 'Role', 'Action', 'Details']]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.getRange('A:A').setNumberFormat('@');\n  }\n  return sh;\n}\n\nfunction norm_(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\\s+/g, ''); }\n\nfunction roleOf_(data) {\n  if (SECRET && data.token === SECRET) return 'admin';\n  var pw = String(data.h == null ? '' : data.h);\n  if (!pw) return null;\n  var ap = P.getProperty('ADMIN_PASS'), sp = P.getProperty('SECRETARY_PASS');\n  if (ap && pw === String(ap).trim()) return 'admin';\n  if (sp && pw === String(sp).trim()) return 'secretary';\n  return null;\n}\n// A secretary can only ADD students and classes. Nothing already saved is changed or removed.\nfunction mergeCfg_(old, inc) {\n  old = old || {}; inc = inc || {};\n  var out = { section: old.section || inc.section || '', students: (old.students || []).slice(), schedules: (old.schedules || []).slice() };\n  var ids = {}, keys = {}, sid = {};\n  out.students.forEach(function (s) { ids[s.i] = 1; keys[norm_(s.c || s.n)] = 1; });\n  (inc.students || []).forEach(function (s) {\n    if (!s || !s.n) return;\n    var k = norm_(s.c || s.n);\n    if (ids[s.i] || keys[k]) return;\n    ids[s.i] = 1; keys[k] = 1;\n    out.students.push({ i: String(s.i), n: String(s.n), c: String(s.c || '') });\n  });\n  out.schedules.forEach(function (x) { sid[x.id] = 1; sid['s:' + norm_(x.subject)] = 1; });\n  (inc.schedules || []).forEach(function (x) {\n    if (!x || !x.subject || sid[x.id] || sid['s:' + norm_(x.subject)]) return;\n    sid[x.id] = 1; sid['s:' + norm_(x.subject)] = 1;\n    out.schedules.push(x);\n  });\n  return out;\n}\nfunction allowed_(user, subject) {\n  if (!user) return true;\n  var c = user.classes || [];\n  if (!c.length) return true;\n  return c.some(function (x) { return norm_(x) === norm_(subject); });\n}\nfunction cfg_() {\n  var n = Number(P.getProperty('CFG_N') || 0), s = '';\n  for (var i = 0; i < n; i++) s += P.getProperty('CFG_' + i) || '';\n  try { return s ? JSON.parse(s) : null; } catch (e) { return null; }\n}\nfunction setCfg_(str) {\n  var old = Number(P.getProperty('CFG_N') || 0), n = Math.ceil(str.length / 8000), o = {}, i;\n  for (i = 0; i < n; i++) o['CFG_' + i] = str.substr(i * 8000, 8000);\n  o.CFG_N = String(n);\n  P.setProperties(o);\n  for (i = n; i < old; i++) P.deleteProperty('CFG_' + i);\n}\nfunction sheet_(ss) {\n  var sh = ss.getSheetByName(TAB);\n  if (!sh) {\n    sh = ss.insertSheet(TAB);\n    sh.getRange(1, 1, 1, REASON_COL).setValues([HEAD.concat(['Reason'])]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.getRange('A:A').setNumberFormat('@');\n    sh.getRange('G:G').setNumberFormat('@');\n    sh.hideColumns(11);\n  } else {\n    if (sh.getMaxColumns() < REASON_COL) sh.insertColumnsAfter(sh.getMaxColumns(), REASON_COL - sh.getMaxColumns());\n    if (!sh.getRange(1, REASON_COL).getValue()) sh.getRange(1, REASON_COL).setValue('Reason').setFontWeight('bold');\n  }\n  return sh;\n}\nfunction cell_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');\n  return String(v == null ? '' : v);\n}\nfunction allRows_(ss) {\n  var sh = ss.getSheetByName(TAB);\n  if (!sh || sh.getLastRow() < 2) return [];\n  return sh.getRange(2, 1, sh.getLastRow() - 1, Math.min(REASON_COL, sh.getMaxColumns())).getValues().map(function (r) { return r.map(cell_); });\n}\nfunction readRows_(ss, user) {\n  return allRows_(ss).filter(function (r) { return allowed_(user, r[1]); });\n}\n\nfunction safeName_(s) { return String(s).replace(/[\\[\\]\\*\\?\\/\\\\:]/g, '-').substr(0, 80); }\n\nfunction buildClass_(subject, rows, cfg) {\n  rows = rows.filter(function (r) { return r[5] !== 'No class'; });\n  var stu = [], seen = {};\n  (cfg.students || []).forEach(function (s) {\n    var k = norm_(s.c || s.n);\n    if (!seen[k]) { seen[k] = true; stu.push({ k: k, n: s.n, c: s.c || '' }); }\n  });\n  rows.forEach(function (r) {\n    var k = norm_(r[4] || r[3]);\n    if (!seen[k]) { seen[k] = true; stu.push({ k: k, n: r[3], c: r[4] }); }\n  });\n  stu.sort(function (a, b) { return String(a.n).localeCompare(String(b.n)); });\n  var dm = {};\n  rows.forEach(function (r) { dm[r[0]] = true; });\n  var dates = Object.keys(dm).sort();\n  var st = {};\n  rows.forEach(function (r) { st[norm_(r[4] || r[3]) + '|' + r[0]] = r[5]; });\n  var tp = 0, tl = 0, te = 0, ta = 0, sumRate = 0, nRate = 0;\n  var body = stu.map(function (s) {\n    var p = 0, l = 0, e = 0, a = 0;\n    var cells = dates.map(function (d) {\n      var v = st[s.k + '|' + d];\n      if (v === 'Present') { p++; return 'P'; }\n      if (v === 'Late') { l++; return 'L'; }\n      if (v === 'Excused') { e++; return 'E'; }\n      a++; return 'A';\n    });\n    var den = p + l + a;\n    var rate = den ? Math.round((p + l) / den * 100) : '';\n    if (rate !== '') { sumRate += rate; nRate++; }\n    tp += p; tl += l; te += e; ta += a;\n    return [s.n, s.c].concat(cells, [p, l, e, a, rate]);\n  });\n  var head = ['Student', 'ID/QR'].concat(dates, ['Present', 'Late', 'Excused', 'Absent', 'Rate %']);\n  var w = head.length;\n  function pad(r) { while (r.length < w) r.push(''); return r; }\n  var values = [\n    pad([subject + (cfg.section ? ' - ' + cfg.section : '')]),\n    pad(['Sessions held: ' + dates.length, 'Class list: ' + stu.length + ' students']),\n    pad(['P = Present, L = Late, E = Excused, A = Absent']),\n    head\n  ].concat(body.map(pad));\n  return {\n    values: values, ncols: 2 + dates.length,\n    sum: [subject, dates.length, stu.length, tp, tl, te, ta, nRate ? Math.round(sumRate / nRate) : '']\n  };\n}\n\nfunction writeTab_(ss, name, values, textCols) {\n  var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clear();\n  var h = values.length, w = values[0].length;\n  if (textCols) sh.getRange(1, 1, h, textCols).setNumberFormat('@');\n  sh.getRange(1, 1, h, w).setValues(values);\n  sh.getRange(1, 1).setFontWeight('bold').setFontSize(13);\n  return sh;\n}\n\nfunction rebuild_(ss, only) {\n  var rows = allRows_(ss), cfg = cfg_() || {}, by = {}, names = {};\n  rows.forEach(function (r) {\n    var k = norm_(r[1]);\n    if (!k) return;\n    (by[k] = by[k] || []).push(r);\n    names[k] = r[1];\n  });\n  (cfg.schedules || []).forEach(function (s) {\n    var k = norm_(s.subject);\n    names[k] = names[k] || s.subject;\n    by[k] = by[k] || [];\n  });\n  var summary = [['Class', 'Sessions held', 'Students', 'Present', 'Late', 'Excused', 'Absent', 'Avg rate %']];\n  Object.keys(names).forEach(function (k) {\n    var t = buildClass_(names[k], by[k], cfg);\n    summary.push(t.sum);\n    if (!only || only.indexOf(k) > -1) {\n      var sh = writeTab_(ss, 'Class - ' + safeName_(names[k]), t.values, t.ncols);\n      sh.getRange(4, 1, 1, t.values[3].length).setFontWeight('bold');\n      sh.setFrozenRows(4);\n      sh.setFrozenColumns(1);\n    }\n  });\n  var sm = writeTab_(ss, 'Summary', summary, 1);\n  sm.getRange(1, 1, 1, 8).setFontWeight('bold');\n  sm.setFrozenRows(1);\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";
function gsScript(t){return GS_SCRIPT.replace('__TOKEN__',t)}
function loadGs(){
  var d={};try{d=JSON.parse(ls.get('talaan-gs')||'{}')||{}}catch(e){}
  if(!d.token){
    var a=new Uint8Array(12),s='';
    try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<12;i++)a[i]=Math.floor(Math.random()*256)}
    for(var j=0;j<a.length;j++)s+='abcdefghijkmnpqrstuvwxyz23456789'.charAt(a[j]%32);
    d.token=s;ls.set('talaan-gs',JSON.stringify({url:d.url||'',token:s,auto:d.auto!==false}));
  }
  return {url:d.url||'',token:d.token||'',auto:d.auto!==false,role:d.role||'',u:d.u||'',h:d.h||'',name:d.name||'',classes:d.classes||[]};
}
function saveGs(){ls.set('talaan-gs',JSON.stringify(S.gs))}
function gsQueue(){try{return JSON.parse(ls.get('talaan-gsq')||'[]')||[]}catch(e){return []}}
function gsSaveQ(q){ls.set('talaan-gsq',JSON.stringify(q))}
function gsSent(){try{return JSON.parse(ls.get('talaan-gssent')||'{}')||{}}catch(e){return {}}}
function gsSaveSent(m){ls.set('talaan-gssent',JSON.stringify(m))}
var SYNC={net:false,pulling:false,last:parseInt(ls.get('talaan-gslast'),10)||0};
function syncState(){
  var on=!!(S.gs&&S.gs.url&&inSyncSec()),q=on?gsQueue().length:0;
  if(navigator.onLine===false)return {k:'off',t:'Offline \u00b7 '+(q?q+' waiting to send':'saved on this phone')};
  if(!on)return {k:'local',t:'Saved on this phone'};
  if(S.gsBusy||SYNC.pulling)return {k:'busy',t:'Syncing...'};
  if(S.gsErr==='auth')return {k:'err',t:'Sign in again'};
  if(S.gsErr||SYNC.net)return {k:'err',t:(q?q+' waiting \u00b7 ':'')+'Cannot reach Sheets'};
  if(q)return {k:'wait',t:q+' waiting to send'};
  return {k:'ok',t:'Synced'+(SYNC.last?' \u00b7 '+fmtTime(new Date(SYNC.last).toISOString()):'')};
}
function syncPillHTML(){var s=syncState();return '<button class="sync s-'+s.k+'" id="sync-pill" type="button" data-act="syncpill" aria-label="Sync status: '+esc(s.t)+'"><i></i>'+esc(s.t)+'</button>'}
function paintSync(){

}
function gsRefresh(){paintSync();var el=document.getElementById('gs-card');if(el&&!el.contains(document.activeElement))el.innerHTML=gsCard()}
function rowHash(row){return JSON.stringify(row[11]?row:row.slice(0,11))}
function gsRows(ses){
  var m={};
  S.students.forEach(function(st){
    var r=recOf(ses,st.i),key=ses.date+'|'+norm(ses.subject)+'|'+norm(st.c||st.n),nc=!!ses.nc;
    m[key]=[ses.date,ses.subject,S.section,st.n,st.c,nc?'No class':r?(r.s==='present'?'Present':r.s==='late'?'Late':'Excused'):'Absent',!nc&&r&&r.t&&r.s!=='excused'?fmtTime(r.t):'',!nc&&r?(r.m==='qr'?'QR':'Manual'):'',fmt12(ses.start),ses.end?fmt12(ses.end):'',key,nc?(ses.ncr||''):(r&&r.s==='excused'&&r.x?r.x:'')];
  });
  return m;
}
/* all: also send students with no record (Absent). force: send even if unchanged. */
function gsSync(ses,all,force){
  if(!S.gs||!S.gs.url||!ses||!inSyncSec())return;
  var want=gsRows(ses),sent=gsSent(),q=gsQueue();
  Object.keys(want).forEach(function(k){
    var row=want[k],hsh=rowHash(row),absent=row[5]==='Absent';
    var pend=q.find(function(o){return o.key===k});
    if(pend){if(pend.h===hsh)return;q=q.filter(function(o){return o.key!==k})}
    if(!force&&sent[k]===hsh)return;
    if(absent&&!all&&sent[k]===undefined)return;
    q.push({key:k,row:row,h:hsh});
  });
  gsSaveQ(q);gsRefresh();gsFlush();
}
var SEC_URL='https://script.google.com/macros/s/AKfycbwKUW64yHvvV6ZZvBQt8RQh5HQk4sK1FkGsk6XeWW-mDFzWXWadc_mOWmoE7QPnxvPj5w/exec';
function isSec(){return !!(S.gs&&S.gs.role==='sec')}
function gsBody(extra){
  var b=S.gs.role?{u:S.gs.u,h:S.gs.h}:{token:S.gs.token};
  for(var k in extra)b[k]=extra[k];return JSON.stringify(b);
}
var GSH={'Content-Type':'text/plain;charset=utf-8'};
/* readable call: throws when Google cannot be reached */
async function gsRead(extra){
  var r=await fetch(S.gs.url,{method:'POST',headers:GSH,body:gsBody(extra)});
  return await r.json();
}
/* tries a readable call first, falls back to fire-and-forget (returns null) */
async function gsPost(extra){
  try{return await gsRead(extra)}catch(e){
    await fetch(S.gs.url,{method:'POST',mode:'no-cors',headers:GSH,body:gsBody(extra)});return null;
  }
}
async function gsFlush(){
  if(!S.gs||!S.gs.url||S.gsBusy||!gsQueue().length||navigator.onLine===false)return;
  return ldWrap('Sending to Google Sheets...',function(){return gsFlush_()},false);
}
async function gsFlush_(){
  if(!S.gs||!S.gs.url||S.gsBusy)return;
  var q=gsQueue();if(!q.length)return;
  if(navigator.onLine===false)return;
  S.gsBusy=true;S.gsErr='';
  var batch=q.slice(0,100);
  try{
    var res=await gsPost({ops:batch.map(function(o){return {key:o.key,row:o.row.slice(0,11),x:o.row[11]||''}})});
    if(res&&res.ok===false){S.gsBusy=false;S.gsErr=res.error==='auth'?'auth':'fail';gsRefresh();return}
    var sent=gsSent();batch.forEach(function(o){sent[o.key]=o.h});gsSaveSent(sent);
    var rest=gsQueue().filter(function(o){return !batch.some(function(b){return b.key===o.key&&b.h===o.h})});
    gsSaveQ(rest);S.gsBusy=false;SYNC.net=false;SYNC.last=Date.now();ls.set('talaan-gslast',String(SYNC.last));gsRefresh();
    if(rest.length)gsFlush();
  }catch(e){S.gsBusy=false;SYNC.net=true;gsRefresh()}
}
async function gsTest(){
  if(!S.gs.url)return;
  return ldWrap('Testing connection...',function(){return gsTest_()},false);
}
async function gsTest_(){
  if(!S.gs.url)return;
  try{
    var res=await gsPost({action:'test'});
    if(res&&res.ok&&res.v<5)toast('Connected. Your script is older: copy the new script and deploy a new version so No class meetings are left out of the class tabs.');
    else toast('Test sent. Open your sheet. A tab named Test should show a new row.');
  }catch(e){toast('Could not reach Google. Check your internet and the URL.')}
}
function gsCode(){return 'TALAAN1:'+btoa(JSON.stringify({u:S.gs.url,t:S.gs.token}))}
function gsSave(){
  var v=String(S.f['f-gsurl']||'').trim(),url=v,tok=S.gs.token;
  if(/^TALAAN1:/i.test(v)){try{var o=JSON.parse(atob(v.slice(8)));url=String(o.u||'');tok=String(o.t||'')}catch(e){url=''}}
  if(!/^https:\/\/script\.google\.com\//.test(url)||!tok){toast('That does not look right. The URL starts with https://script.google.com/ and ends with /exec.');return}
  if(url!==S.gs.url){gsSaveSent({});gsSaveQ([])}
  S.gs.url=url;S.gs.token=tok;saveGs();ls.set('talaan-syncsec',S.curSec);S.gsOpen=false;delete S.f['f-gsurl'];
  toast('Connected. Tap Send test to check.');render();
}
function gsSetup(){

    +'<li>Open <strong>sheets.google.com</strong> in Chrome. Tap the menu and turn on <strong>Desktop site</strong>. Create a blank spreadsheet.</li>'
    +'<li>Tap <strong>Extensions</strong>, then <strong>Apps Script</strong>.</li>'

function mergeCfgAdds(cfg){
  var ch=0,ids={},codes={},names={},have={};

function isoFrom(date,t,fallback){
  var hm=parse12(t)||fallback||'12:00',d=String(date).split('-').map(Number),p=hm.split(':').map(Number);

function mergeRows(rows){
  var ch=0;
  rows.forEach(function(r){
    var date=String(r[0]||''),subj=String(r[1]||''),code=r[4],name=r[3],st=r[5];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!subj)return;
    if(S.gone.indexOf(norm(subj))>-1||S.gone.indexOf(date+'|'+norm(subj))>-1)return;
    var sch=S.schedules.find(function(x){return norm(x.subject)===norm(subj)});
    if(isSec()&&!sch)return;
    var ses=null;
    Object.keys(S.sessions).forEach(function(k){var s=S.sessions[k];if(!ses&&s.date===date&&norm(s.subject)===norm(subj))ses=s});
    if(!ses){
      var id=uid('s');
      ses=S.sessions[id]={id:id,date:date,subject:subj,start:parse12(r[8])||(sch&&sch.slots[0].start)||'07:30',end:parse12(r[9])||'',grace:sch?sch.grace:10,created:Date.now(),sch:sch?sch.id:'',records:[]};
      ch++;
    }
    if(st==='No class'){if(!ses.nc){ses.nc=1;ch++}var nr0=r[11]?String(r[11]).slice(0,80):'';if(nr0!==(ses.ncr||'')){ses.ncr=nr0;ch++}return}
    if(ses.nc&&isSec()){delete ses.nc;delete ses.ncr;ch++}
    if(!st||st==='Absent')return;
    var stu=S.students.find(function(s){return (code&&s.c&&norm(s.c)===norm(code))||norm(s.n)===norm(name)});
    if(!stu)return;
    var have=recOf(ses,stu.i),why=st==='Excused'&&r[11]?String(r[11]).slice(0,80):'';
    if(have){if(have.s==='excused'&&!have.x&&why){have.x=why;ch++}return}
    var nr={i:stu.i,t:st==='Excused'?null:isoFrom(date,r[6],ses.start),m:r[7]==='QR'?'qr':'manual',s:st==='Late'?'late':st==='Excused'?'excused':'present'};
    if(why)nr.x=why;
    ses.records.push(nr);ch++;
  });
  return ch;
}

async function gsPull_(silent){
  if(!S.gs||!S.gs.url||!inSyncSec()||navigator.onLine===false)return;
  if(silent&&Date.now()-gsPullAt<15000)return;
  gsPullAt=Date.now();logFlush();
  if((S.students.length||S.schedules.length)&&ls.get('talaan-gscfg')!==cfgHash()){try{await cfgPush_(false)}catch(e){}}
  var res;
  try{res=await gsRead({action:'pull'})}catch(e){SYNC.net=true;if(!silent)toast('Could not read from Google Sheets. Check your internet.');return}
  SYNC.net=false;
  if(!res||res.ok===false){
    if(!silent)toast(res&&res.error==='auth'?'Your name or password is no longer valid. Sign out and sign in again.':'Sync failed. Make sure the newest script is deployed.');
    return;
  }
  SYNC.last=Date.now();ls.set('talaan-gslast',String(SYNC.last));
  var ch=0;
  if(res.cfg){
    var clean=ls.get('talaan-gscfg')===cfgHash();
    if(isSec()||clean||(!S.students.length&&!S.schedules.length))ch+=applyCfg(res.cfg);
    else ch+=mergeCfgAdds(res.cfg);
    if(clean||isSec()||!S.students.length)ls.set('talaan-gscfg',cfgHash());
  }
  ch+=mergeRows(res.rows||[]);
  if(ch){saveLocal();pickActive();render()}
  if(!silent)toast(ch?'Synced with Google Sheets.':'Already up to date.');
}

function monthSpan(m,n){
  var p=String(m||'').split('-'),y=parseInt(p[0],10),mo=parseInt(p[1],10);

  if(mode==='month'){var a=monthSpan(o.m,1);o.from=a[0];o.to=a[1]}
  else if(mode==='quarter'){var b=monthSpan(o.q,3);o.from=b[0];o.to=b[1]}

}

function submitForm(name){
  if(name==='login'){doLogin();return}
  if(name==='bulkx'){doBulkX();return}
  if(name==='pin'){doPinForm();return}
  if(isSec()&&(name==='section'||name==='addsec')){toast('Only the class admin can do that.');return}
  if(submitForm2(name))return;
  if(name==='newclass'){
    var subj=$('#f-subj').value.trim(),date=$('#f-date').value,start=$('#f-start').value,end=$('#f-end').value,grace=parseInt($('#f-grace').value,10);
    if(!subj){S.err='Enter the subject.';renderSheet();return}
    if(!date||!start){S.err='Fill in the date and time.';renderSheet();return}
    if(!end||end<=start){S.err='End time must be after the start time.';renderSheet();return}
    var id=uid('s');
    goneDrop(date+'|'+norm(subj));goneDrop(norm(subj));
    S.sessions[id]={id:id,date:date,subject:subj,start:start,end:end,grace:isNaN(grace)?10:Math.max(0,Math.min(120,grace)),created:Date.now(),records:[]};
    if(new Date()>endAt(S.sessions[id]))S.sessions[id].keep=true;
    persistSession(id);setActive(id);S.sheet=null;S.err='';S.tab='scan';S.last=null;
    ['f-subj','f-date','f-start','f-end','f-grace'].forEach(function(k){delete S.f[k]});
    renderSheet();window.scrollTo(0,0);render();logAct('Session added',subj+' '+date);toast('Session created.');
  }else if(name==='newsched'){
    var sj=$('#f-ssubj').value.trim(),sg=parseInt($('#f-sgrace').value,10),slots=[],bad='';
    DAY_ORDER.forEach(function(k){
      if(!$('#f-day-'+k).checked)return;
      var a=$('#f-ds-'+k).value,b=$('#f-de-'+k).value;
      if(!a||!b||b<=a){bad=bad||('End time must be after the start time on '+DAYS[k]+'.');return}
      slots.push({d:k,start:a,end:b});
    });
    if(!sj){S.err='Enter the subject.';renderSheet();return}
    if(bad){S.err=bad;renderSheet();return}
    if(!slots.length){S.err='Pick at least one day.';renderSheet();return}
    goneDrop(norm(sj));
    S.schedules=S.schedules.concat([{id:uid('sc'),subject:sj,slots:slots,grace:isNaN(sg)?10:Math.max(0,Math.min(120,sg))}]);
    persistRoster();S.sheet=null;S.err='';
    ['f-ssubj','f-sgrace'].concat([0,1,2,3,4,5,6].reduce(function(a,k){return a.concat(['f-day-'+k,'f-ds-'+k,'f-de-'+k])},[])).forEach(function(k){delete S.f[k]});
    logAct('Class added',sj);renderSheet();render();toast('Class added.');

/* edit meeting */
function editChangeCount(ses,start,end,grace){
  var tmp={date:ses.date,start:start,end:end,grace:grace},n=0;
  ses.records.forEach(function(r){if(r.s==='excused'||!r.t)return;if(statusFor(tmp,new Date(r.t))!==r.s)n++});
  return n;
}
function editPreview(ses,start,end,grace){
  if(!start||!end||end<=start)return '';
  var n=editChangeCount(ses,start,end,isNaN(grace)?0:grace);
  return n?n+' time-in'+(n>1?'s':'')+' will change between Present and Late.':'No time-in will change status.';
}
function applyEdit(ses,start,end,grace){
  ses.start=start;ses.end=end;ses.grace=grace;
  ses.records=ses.records.map(function(r){
    if(r.s==='excused'||!r.t)return r;
    var ns=statusFor(ses,new Date(r.t));
    if(ns===r.s)return r;
    var o={};for(var k in r)o[k]=r[k];o.s=ns;return o;
  });
  var en=endAt(ses);if(en&&en>new Date())ses.closed=false;
  persistSession(ses.id);
}
function doEditSess(){
  var sh=S.sheet,ses=sh&&S.sessions[sh.id];if(!ses)return;
  var st=fv('f-es-start',ses.start),en=fv('f-es-end',ses.end||''),gr=parseInt(fv('f-es-grace',ses.grace),10);
  if(!st||!en){S.err='Fill in the start and end time.';renderSheet();return}
  if(en<=st){S.err='End time must be after the start time.';renderSheet();return}
  gr=isNaN(gr)?10:Math.max(0,Math.min(120,gr));
  var n=editChangeCount(ses,st,en,gr);
  withUndo('Meeting updated'+(n?' \u00b7 '+n+' status'+(n>1?'es':'')+' changed':'')+'.',function(){applyEdit(ses,st,en,gr)});
  ['f-es-start','f-es-end','f-es-grace'].forEach(function(k){delete S.f[k]});
  S.err='';S.sheet=null;renderSheet();render();
}

/* student page */
var CL={p:'Present',l:'Late',e:'Excused',a:'Absent'},CP={p:'present',l:'late',e:'excused',a:'absent'};
function stuData(i){
  var G={},order=[],tot={p:0,l:0,e:0,a:0};
  sortedSessions('desc').forEach(function(s){
    if(s.nc)return;
    var k=norm(s.subject),g=G[k];
    if(!g){g=G[k]={name:s.subject,p:0,l:0,e:0,a:0,rows:[]};order.push(k)}
    var r=recOf(s,i),c='';
    if(r)c=r.s==='late'?'l':r.s==='excused'?'e':'p';else if(isOver(s))c='a';
    if(c){g[c]++;tot[c]++}
    g.rows.push({date:s.date,c:c,rec:r||null});
  });
  var list=order.map(function(k){var g=G[k],d=g.p+g.l+g.a;g.rate=d?Math.round((g.p+g.l)/d*100):null;return g});
  var d2=tot.p+tot.l+tot.a;
  return {groups:list,tot:tot,rate:d2?Math.round((tot.p+tot.l)/d2*100):null};
}
function stuDetail(x){
  var r=x.rec;
  if(x.c==='p'||x.c==='l')return (r.t?fmtTime(r.t):'')+(r.m==='manual'?' \u00b7 manual':'');
  if(x.c==='e')return r.x||'No reason given';
  if(x.c==='a')return 'No time-in';
  return 'Meeting in progress';
}
